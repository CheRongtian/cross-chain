apiVersion: 1
providers:
  - name: cross-chain-protocol
    orgId: 1
    folder: Cross-Chain
    folderUid: cross-chain-observability
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Set this to the absolute repository-local dashboards directory in the
      # Grafana process environment. This is not a protocol worker setting.
      path: $CROSS_CHAIN_GRAFANA_DASHBOARDS_PATH
